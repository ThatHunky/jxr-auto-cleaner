name: Build

# PRs and master pushes: build the exe + MSI (catches MSVC/WiX breakage).
# Release: push a v* tag, or run this workflow manually on master ("Run
# workflow" in the Actions tab). Either way it publishes v<CMake version> with
# the MSI and RELEASE_NOTES.md; a manual run creates the tag itself.
on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read version from CMakeLists.txt
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(JxrAutoCleaner VERSION (\d+\.\d+\.\d+)'
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match CMakeLists.txt version $v"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF -ne 'refs/heads/master') {
              throw "Manual releases run on master only (got $env:GITHUB_REF)"
            }
            # Never touch an existing release: bump the version first.
            if (git ls-remote --tags origin "refs/tags/v$v") {
              throw "Tag v$v already exists; bump the version in CMakeLists.txt"
            }
          }

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      # Same version as setup.bat; extensions come from the repo's .wix/ cache.
      - name: Install WiX
        run: dotnet tool install --global wix --version 6.0.2

      - name: Build MSI
        run: >
          wix build installer\Package.wxs -d BuildOutput=build\Release
          -o build\JxrAutoCleaner-v${{ steps.version.outputs.version }}.msi
          -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext

      - uses: actions/upload-artifact@v4
        with:
          name: JxrAutoCleaner-v${{ steps.version.outputs.version }}
          path: |
            build/Release/JxrAutoCleaner.exe
            build/JxrAutoCleaner-v${{ steps.version.outputs.version }}.msi

      - name: Publish release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: JxrAutoCleaner v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: build/JxrAutoCleaner-v${{ steps.version.outputs.version }}.msi
